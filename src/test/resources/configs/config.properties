# Moi truong chay: ten file properties trong cung thu muc (dev, staging...)
# De trong thi chi dung mot minh file config.properties nay
env = dev

browser = chrome
headless = true
window_size_x = 1920
window_size_y = 1080
excel_path_crm_data = src/test/resources/testdata/crm_data.xlsx
excel_path_crm_data_customer = src/test/resources/testdata/crm_data_customer.xlsx
explicit_wait_timeout = 10
SCREENSHOT_PATH = exports/screenshots
VIDEO_RECORD_PATH = exports/videorecords
SCREENSHOT_PASSED_STEP = false
SCREENSHOT_FAILED_STEP = true
SCREENSHOT_ALL_STEPS = false
VIDEO_RECORD_ACTIVE = false